[project]
name = "ticket-handle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Doruk Karaboncuk", email = "doruk.karaboncuk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-openai>=1.8.5",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
ticket-handle = "ticket_handle:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
